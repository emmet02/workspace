image: python:${PYTHON_VERSION:-3.13}

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  PYTHON_VERSION: "3.13"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .venv/
    - .uv-cache/

stages:
  - setup
  - test
  - build
  - deploy

.run_on_mr: &run_on_mr
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.run_on_default: &run_on_default
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.run_on_mr_and_default: &run_on_mr_and_default
  extends: [.run_on_mr, .run_on_default]

.activate_env: &activate_env
  before_script:
    - source .venv/bin/activate

environment:
  stage: setup
  script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.cargo/bin:$PATH"
    - uv venv --python ${PYTHON_VERSION}
    - source .venv/bin/activate
    - uv sync
  artifacts:
    paths:
      - .venv/
    expire_in: 1 day
  extends: .run_on_mr_and_default

test:
  stage: test
  needs: [environment]
  extends: [.activate_env, .run_on_mr_and_default]
  script:
    - uv install ".[test]"
    - ruff check . --output-format json --output-file ruff-report.json
    - ruff format --check .
    - ty check
    - bandit -r . -f json -o bandit-report.json
    - pytest
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  coverage_report:
    coverage_format: cobertura
    path: coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: junit.xml
      codequality: ruff-report.json
      sast: bandit-report.json
    expire_in: 1 week

pages:
  stage: deploy
  needs: [environment, test]
  extends: .activate_env
  script:
    - uv install ".[docs]"
    - mkdocs build --strict
  artifacts:
    paths:
      - site
  extends: .run_on_default 