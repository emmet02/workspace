name: 'Setup Python with uv'
description: 'Sets up Python and uv with virtual environment'

inputs:
  python-version:
    description: 'Python version to use'
    required: true
    default: '3.13'
  install-deps:
    description: 'Dependencies to install (e.g., ".[test]")'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Setup virtual environment
      shell: bash
      run: |
        uv venv --python ${{ inputs.python-version }}
        source .venv/bin/activate
        uv sync
        if [ -n "${{ inputs.install-deps }}" ]; then
          uv install ${{ inputs.install-deps }}
        fi 